name: Build Fruits Warehouse APK

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Java Setup
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Check files
    run: |
      pwd
      ls -la
      find . -maxdepth 3 -name "build.gradle.kts" -o -name "settings.gradle.kts"
