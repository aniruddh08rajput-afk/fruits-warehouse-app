name: Build Fruits Warehouse APK

on:
push:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Check project files
    run: |
      ls -la
      find . -maxdepth 4 \( -name "settings.gradle.kts" -o -name "build.gradle.kts" -o -name "gradlew" \) -print

  - name: Build APK
    run: gradle -p app assembleDebug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Fruits-Warehouse-APK
      path: app/build/outputs/apk/debug/*.apk
